name: Sync Releases from Spotify

on:
  schedule:
    - cron: '0 14 * * *'  # 9am ET daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync FOEMOB releases from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FOEMOB_ARTIST_ID: ${{ secrets.FOEMOB_ARTIST_ID }}
        run: |
          node .github/workflows/sync-releases.mjs

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain releases.json)" ]; then
            git config user.name "torch-bot"
            git config user.email "bot@torchmusicgroup.com"
            git add releases.json
            git commit -m "chore: sync FOEMOB releases from Spotify"
            git push
          else
            echo "No changes to commit"
          fi
